[package]
name = "ck"
version = "0.1.0"
edition = "2024"
description = "Report what changed in a command's failures since the last run"
homepage = "https://github.com/excelano/ck"
repository = "https://github.com/excelano/ck"
license = "MIT"
authors = ["David M. Anderson"]
keywords = ["cli", "testing", "diff", "agent", "wrapper"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# The only dependency, and it is bindings rather than code: setpgid, kill,
# tcsetpgrp and sigaction have no std equivalent. No C is compiled — libc
# declares symbols the binary already links against.
libc = "0.2"

[profile.dist]
inherits = "release"
lto = "thin"
